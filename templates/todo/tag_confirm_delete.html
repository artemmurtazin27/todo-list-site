{% extends "base.html" %}

{% block content %}
  <div class="mt-3">
    <h1 class="font-weight-bold mb-3">Delete Tag</h1>

    <p>Are you sure you want to delete the tag: <strong>{{ tag.name }}</strong>?</p>
    <p class="text-muted"><i>This tag will be removed from all associated tasks, but the tasks will not be deleted.</i></p>

    <form action="" method="post">
      {% csrf_token %}
      <input type="submit" value="Yes, delete" class="btn btn-danger" />
      <a href="{% url 'todo:tag-list' %}" class="btn btn-secondary ml-2">Cancel</a>
    </form>
  </div>
{% endblock %}
