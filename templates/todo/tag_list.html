{% extends "base.html" %}

{% block content %}
  <div class="d-flex justify-content-between align-items-center mt-3 mb-4">
    <h1 class="font-weight-bold">Tags</h1>
    <a class="btn btn-primary" href="{% url 'todo:tag-create' %}">Add</a>
  </div>
  {% if tag_list %}
    <table class="table">
      <thead>
        <tr>
          <th scope="col" style="border-top: none;">Name</th>
          <th scope="col" style="border-top: none;">Update</th>
          <th scope="col" style="border-top: none;">Delete</th>
        </tr>
      </thead>
      <tbody>
        {% for tag in tag_list %}
          <tr>
            <td class="align-middle font-weight-bold">{{ tag.name }}</td>
            <td>
              <a class="btn btn-secondary" href="{% url 'todo:tag-update' pk=tag.id %}">Update</a>
            </td>
            <td>
              <a class="btn btn-secondary" href="{% url 'todo:tag-delete' pk=tag.id %}">Delete</a>
            </td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  {% else %}
    <p>No tags available.</p>
  {% endif %}
{% endblock %}
