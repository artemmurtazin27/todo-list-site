{% extends "base.html" %}

{% block content %}
  <div class="mt-3">
    <h1 class="font-weight-bold mb-3">Delete Task</h1>

    <p>Are you sure you want to delete the task: <strong>{{ task.content }}</strong>?</p>

    <form action="" method="post">
      {% csrf_token %}
      <input type="submit" value="Yes, delete" class="btn btn-danger" />
      <a href="{% url 'todo:index' %}" class="btn btn-secondary ml-2">Cancel</a>
    </form>
  </div>
{% endblock %}
